# Local dev with hot reload: bind-mounts source over plain node images and
# runs the same `npm run dev` scripts you'd run on the host. node_modules
# live in named volumes so the container's Linux build of better-sqlite3
# isn't clobbered by whatever's on the host.
#
# Usage:
#   NPMRC_PATH=$HOME/.npmrc docker compose -f compose.dev.yaml up
#     backend  -> http://localhost:3141
#     frontend -> http://localhost:5173
#
# NPMRC_PATH must point at a .npmrc carrying the @tackgnol GitHub Packages
# token (your existing global ~/.npmrc already has it) — never a project
# file, never committed.

services:
  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache python3 make g++ >/dev/null && cp /run/secrets/npmrc ~/.npmrc && npm ci --legacy-peer-deps && rm -f ~/.npmrc && npm run migrate && npm run dev"
    secrets:
      - npmrc
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dev_data:/app/data
    environment:
      PORT: 3141
      DB_PATH: /app/data/data.sqlite
      TRUSTED_ORIGINS: http://localhost:5173
      AUTH_BASE_URL: http://localhost:3141
      BETTER_AUTH_SECRET: dev-only-secret-change-me
    ports:
      - "3141:3141"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:3141
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  backend_dev_data:
  frontend_node_modules:

secrets:
  npmrc:
    file: ${NPMRC_PATH:?Set NPMRC_PATH to a .npmrc with the @tackgnol token, e.g. $HOME/.npmrc}
